[pytest]
addopts = --import-mode=importlib
# `src` mirrors PYTHONPATH=/app:/app/src from docker/pytest-cli/Dockerfile.
# Without it, host-side runs under .venv cannot import brownfield_ai, which
# breaks the skills leg of ci/test_changed.sh: that leg collects all of tests/
# and filters by skill name, so a skill whose name appears in unrelated test
# ids pulls those tests in and they fail on import rather than on their logic.
pythonpath = tests src
testpaths = tests
norecursedirs = repos tests/ci tests/src tests/workflows tests/skills tests/integration
markers =
    integration: marks tests requiring Docker containers (deselect with '-m "not integration"')
# Both values match pytest-asyncio's current defaults; they are pinned so the
# contract survives a plugin major bump. `strict` requires every async test to
# carry an explicit @pytest.mark.asyncio; the loop scope silences the unset-value
# warning that a future major will harden into an error.
asyncio_mode = strict
asyncio_default_fixture_loop_scope = function
