version: '3'

vars:
  LEDGER_SCRIPT: >-
    workflows/agent-memory/skills/execution-ledger/scripts/chromadb_ledger.py

tasks:
  index:
    desc: List all epics in the execution ledger
    preconditions:
      - sh: docker ps -q --filter "name=global-chromadb" | grep -q .
        msg: "ChromaDB is not running. Run: task chromadb:start"
    cmds:
      - ./docker/shared/python-security-gate.sh run {{.LEDGER_SCRIPT}}
      - defer: rm -f tmp/.python-gate-pass
      - >-
        docker compose run --rm --user agent
        -v {{.ROOT_DIR}}/tmp/.python-gate-pass:/tmp/.python-gate-pass:ro
        python-cli python3
        {{.LEDGER_SCRIPT}} index-epics {{.CLI_ARGS}}

  resume:
    desc: Load full context for an epic (plan, decisions, verdicts)
    preconditions:
      - sh: docker ps -q --filter "name=global-chromadb" | grep -q .
        msg: "ChromaDB is not running. Run: task chromadb:start"
    cmds:
      - ./docker/shared/python-security-gate.sh run {{.LEDGER_SCRIPT}}
      - defer: rm -f tmp/.python-gate-pass
      - >-
        docker compose run --rm --user agent
        -v {{.ROOT_DIR}}/tmp/.python-gate-pass:/tmp/.python-gate-pass:ro
        python-cli python3
        {{.LEDGER_SCRIPT}} resume {{.CLI_ARGS}}

  timeline:
    desc: Show chronological artifact history for an epic
    preconditions:
      - sh: docker ps -q --filter "name=global-chromadb" | grep -q .
        msg: "ChromaDB is not running. Run: task chromadb:start"
    cmds:
