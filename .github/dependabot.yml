version: 2
updates:
  # One entry per directory that actually contains a pip manifest. Dependabot
  # errors out on a directory it cannot parse, so every path below must hold a
  # requirements file. Updates are grouped so each directory raises a single PR
  # per interval rather than one per dependency.
  #
  # Not monitored: /docker/shared (shell scripts only) and the npm manifest at
  # /services/dashboard/frontend (add a "npm" entry there if JS updates are
  # wanted — the lockfile is now tracked, so it would work).

  # requirements.txt — runtime and tooling dependencies for scripts and src/brownfield_ai.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      root-python:
        patterns: ["*"]

  # tests/requirements.txt — pytest and test-only tooling.
  - package-ecosystem: "pip"
    directory: "/tests"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      tests-python:
        patterns: ["*"]

  # requirements.txt + requirements-dev.txt for the dashboard service.
  #
  # Scoped with "allow" because services/dashboard/requirements.txt opens with
  # `-r ../../requirements.txt`. Dependabot's pip fetcher follows `-r` includes
  # across directory boundaries, so without this filter the job would also fetch
  # and update the root requirements.txt that the "/" entry above already owns —
  # two weekly PRs editing the same file. The list below is exactly the packages
  # declared by the dashboard's own manifests.
  #
  # Upkeep trade-off: a new dashboard dependency MUST be added to this allow list
  # as well, or it silently receives no updates.
  - package-ecosystem: "pip"
    directory: "/services/dashboard"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    allow:
      - dependency-name: "fastapi"
      - dependency-name: "uvicorn"
      - dependency-name: "httpx"
      - dependency-name: "pytest-asyncio"
    groups:
      dashboard-python:
        patterns: ["*"]
