name: CI Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Pinned go-task release with checksum verification, in preference to a
      # third-party setup action. Stronger than the uv step in test.yml: the
      # checksum covers the release artifact itself, not just an installer
      # script, so the binary is content-addressed.
      # Regenerate on version bump:
      #   curl -sSL https://github.com/go-task/task/releases/download/<tag>/task_checksums.txt \
      #     | grep linux_amd64.tar.gz
      - name: Install Task
        run: |
          curl -sSL -o "$RUNNER_TEMP/task.tar.gz" \
            "https://github.com/go-task/task/releases/download/$TASK_VERSION/task_linux_amd64.tar.gz"
          echo "$TASK_CHECKSUM  $RUNNER_TEMP/task.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/task.tar.gz" -C "$RUNNER_TEMP" task
          mkdir -p "$HOME/.local/bin"
          install -m 0755 "$RUNNER_TEMP/task" "$HOME/.local/bin/task"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        env:
          TASK_VERSION: "v3.52.0"
          TASK_CHECKSUM: "02c679ffae53dca791804847d78b31731615894e292948397c971c87ac9e95bd"

      - name: Verify Task is available
        run: task --version

      - name: Build Infra Lint Image
        run: task builders:infra-lint

      - name: Run Lint
        run: task lint:changed
