# Project-local Codex CLI config for this workspace.
#
# No `[profiles.*]` table is declared here, and none may be added. On
# codex-cli 0.146.0 this project-local path is not a config layer codex
# loads at all: keys written here — `model` and
# `model_reasoning_effort` included — never reach the run, which falls
# back to the CLI defaults even when `workdir` is this directory. A
# profile table added here would therefore be inert, giving a false
# impression that the reviewer is pinned by config. The honored form on
# this version is a separate `$CODEX_HOME/<name>.config.toml` file.
#
# The `-p reviewer` profile is defined in a user-level config instead:
# docker/agent-cli/codex-config.toml, which the agent-cli image installs
# at /home/agent/.codex/config.toml and scripts/setup_codex_reviewer.sh
# provisions into a developer's ~/.codex/config.toml. That profile is
# intended to supply the reviewer model, but installed at that loaded
# path its `[profiles.reviewer]` table aborts `codex exec -p reviewer`
# with a fatal config-load error instead of pinning anything;
# relocating it to `$CODEX_HOME/reviewer.config.toml` is tracked as
# TODO-0228. scripts/agent-cli/codex-review.sh overrides the model with
# `-m` only when the caller passes MODEL, and carries the reasoning
# effort itself as a top-level `-c model_reasoning_effort=<value>` on
# the invocation — no config layer sets that key.
#
# Criteria live in .claude/prompts/reviewer/_invariants.md
# (INVARIANT:criteria + INVARIANT:adversarial-rigor blocks) and the
# per-type templates beside it. For every REVIEW_TYPE the wrapper
# concatenates the selected template with the sanitized subject and pipes
# the result to `codex exec -p reviewer` on stdin, which is the sole
# subject channel. Raw `codex exec -p reviewer` invocations (bypassing
# the task wrapper) are NOT a supported path — the task wrapper is the
# single source of criteria since criteria live in the templates.
# Do not duplicate criteria here. The template-lint
# (`_check_codex_toml_file` in scripts/lint_reviewer_templates.py)
# inspects only `[profiles.reviewer.instructions]`, a section this file
# may never declare, so nothing written here is checked — this
# instruction is the only control on that path.
