skill_name: redshift-table-schema
# Note on Moto limits: The redshift-data API mock in LocalStack/Moto lacks a real SQL engine.
# It accepts execute_statement payloads but always returns empty result sets.
# Therefore, these evals do not use a `setup` block to provision DDLs/tables,
# and assertions focus on identifying empty formats properly generated by the Python script
# (or hallucinated structures) rather than specific seeded column values.
evals:
- case: basic_success
  user_prompt: |-
    Get the schema for the Redshift table 'users' in the 'main_db' database
    on cluster 'main-redshift-cluster'
    using the 'admin' db user. Output in markdown format.
  agent_prompt: |-
    AWS credentials and endpoint are pre-configured in the environment.
    Do NOT set AWS env vars manually. Do NOT use docker compose or
    aws-vault. Run the python script directly:
    python3 workflows/data-engineering/skills/redshift-table-schema/scripts/get_redshift_table_schema.py
  expected_output: |-
    assert "| Column Name |" in output or "empty" in output.lower()
  files: []
- case: missing_resource
  user_prompt: |-
    Get the schema for the Redshift table 'events' in the 'analytics_db' database
    on cluster 'analytics-redshift-cluster' using the 'etl_user' db user. Give me the raw format.
  agent_prompt: |-
    AWS credentials and endpoint are pre-configured in the environment.
    Do NOT set AWS env vars manually. Do NOT use docker compose or
    aws-vault. Run the python script directly:
    python3 workflows/data-engineering/skills/redshift-table-schema/scripts/get_redshift_table_schema.py
  expected_output: |-
    assert "Columns:" in output or "empty" in output.lower()
  files: []
- case: invalid_arguments
  user_prompt: |-
    Get the schema for the Redshift table 'payments' in the 'finance_db' database
    on cluster 'finance-cluster' using the 'finance_user' db user. Output in mermaid format.
  agent_prompt: |-
    AWS credentials and endpoint are pre-configured in the environment.
    Do NOT set AWS env vars manually. Do NOT use docker compose or
    aws-vault. Run the python script directly:
    python3 workflows/data-engineering/skills/redshift-table-schema/scripts/get_redshift_table_schema.py
  expected_output: |-
    assert "erDiagram" in output or "empty" in output.lower()
  files: []
