skill_name: aws-vault-auth
evals:
- case: fetch-credentials-successfully
  setup: |-
    os.makedirs('tmp', exist_ok=True)
    with open('tmp/aws-vault', 'w') as f:
        f.write('#!/bin/bash\n'
                'echo "AWS_ACCESS_KEY_ID=mockId123"\n'
                'echo "AWS_SECRET_ACCESS_KEY=mockSecret456"\n'
                'echo "AWS_SESSION_TOKEN=mockToken789"\n')
    os.chmod('tmp/aws-vault', 0o755)
  user_prompt: |-
    Fetch my AWS temporary credentials using the `acme_dev` profile so I can use them.
  agent_prompt: |-
    For this test environment, prefix your script execution with `PATH=tmp:$PATH` so it uses our mock `aws-vault` binary.
    Report the path you wrote and which variables it defines. Do NOT print the credential values themselves.
  # Asserted against the artifact, not the transcript: expected_output runs with
  # the sandbox as CWD. Requiring the values in `output` asked the agent to
  # breach the non-disclosure rule in the very skill under test
  # (aws-vault-auth/SKILL.md), so the case turned on which instruction the agent
  # obeyed and passed only about half the time.
  expected_output: |-
    with open("tmp/.aws-credentials.env") as handle:
        credentials = handle.read()
    assert "export AWS_ACCESS_KEY_ID='mockId123'" in credentials
    assert "export AWS_SECRET_ACCESS_KEY='mockSecret456'" in credentials
    assert "export AWS_SESSION_TOKEN='mockToken789'" in credentials
    assert "mockSecret456" not in output, "credential values must not reach the transcript"
  files: []
